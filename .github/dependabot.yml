version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react*"]
      tooling:
        patterns: ["*"]
        exclude-patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react*"]
    ignore:
      # eslint-config-next 16 does not support ESLint 10 yet.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Major TypeScript versions wait for Next.js to support them.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Bump the Node types by hand, to the Node major in .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
